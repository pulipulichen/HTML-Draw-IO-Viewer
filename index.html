<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f5f9">
    <meta name="msapplication-TileColor" content="#f1f5f9">
    <meta name="msapplication-TileImage" content="./assets/favicon/favicon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Draw.io AI Editor</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./assets/favicon/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="./assets/favicon/favicon.png">
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Draw.io 官方 Viewer 腳本 -->
    <script type="text/javascript" src="https://app.diagrams.net/js/viewer-static.min.js"></script>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body class="bg-slate-100 h-screen flex flex-col md:flex-row overflow-hidden font-sans text-slate-800">

    <!-- 左側面板：輸入與控制 (增加捲動軸) -->
    <div class="w-full md:w-[400px] lg:w-[450px] h-1/2 md:h-full bg-white border-r border-slate-200 flex flex-col shadow-lg z-10 overflow-y-auto">
        <div class="p-5 flex flex-col gap-6">
            
            <!-- 標題 -->
            <div class="flex items-center justify-between gap-3">
                <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    <span data-i18n="header.title">Draw.io AI Editor</span>
                </h1>
                <div class="flex items-center gap-2">
                    <label for="languageSelect" class="text-xs text-slate-500 font-medium" data-i18n="language.label">Language</label>
                    <select id="languageSelect" class="px-2 py-1.5 text-xs border border-slate-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </select>
                </div>
            </div>

            <!-- 區塊 1：XML 編輯區 -->
            <div class="flex flex-col min-h-[320px]">
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-medium text-slate-600" data-i18n="editor.xmlLabel">XML Source (Live Preview)</label>
                    <button id="formatBtn" class="text-xs text-blue-600 hover:text-blue-800 font-medium" data-i18n="editor.rerenderBtn">Rerender</button>
                </div>
                <textarea id="xmlInput" class="w-full min-h-[260px] p-3 border border-slate-300 rounded-md font-mono text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y shadow-inner bg-slate-50" data-i18n-placeholder="editor.xmlPlaceholder" placeholder="Paste your Draw.io XML here..."></textarea>
            </div>

            <!-- 區塊 2：匯入與工具 -->
            <div class="border-t border-slate-200 pt-4">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-slate-700" data-i18n="import.title">File and URL Import</h3>
                    <button id="loadSampleBtn" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded transition-colors font-medium" data-i18n="import.loadSampleBtn">Load Sample XML</button>
                </div>
                
                <div class="flex gap-2 mb-3">
                    <input type="text" id="urlInput" data-i18n-placeholder="import.urlPlaceholder" placeholder="Enter XML URL..." class="flex-1 px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <button id="fetchBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-md text-sm font-medium transition-colors whitespace-nowrap" data-i18n="import.loadBtn">Load</button>
                </div>

                <div id="dropzone" class="border-2 border-dashed border-slate-300 rounded-lg p-4 text-center bg-slate-50 hover:bg-slate-100 transition-colors group flex flex-col items-center justify-center gap-1 cursor-pointer">
                    <p class="text-xs text-slate-500 group-hover:text-slate-700" data-i18n="import.dropzoneHint">Drag and drop .drawio / .xml files here</p>
                    <span class="text-[10px] text-slate-400 my-1" data-i18n="import.orDivider">- or -</span>
                    <button type="button" id="uploadBtn" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 px-4 py-1.5 rounded text-xs font-medium transition-colors shadow-sm pointer-events-auto" data-i18n="import.selectFileBtn">
                        Select local file
                    </button>
                    <input type="file" id="fileInput" accept=".xml,.drawio" class="hidden">
                </div>
            </div>

            <!-- 區塊 3：Gemini AI 助手 -->
            <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600"><path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                        <h2 class="text-md font-bold text-indigo-900" data-i18n="ai.title">Gemini AI Assistant</h2>
                    </div>
                    <button id="openGeminiSettingsBtn" class="text-xs bg-white border border-indigo-200 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-md transition-colors font-medium" data-i18n="ai.settingsBtn">
                        Gemini Settings
                    </button>
                </div>

                <div>
                    <label class="block text-xs font-medium text-indigo-700 mb-1" data-i18n="ai.promptLabel">Edit diagram with natural language</label>
                    <textarea id="aiPrompt" rows="3" data-i18n-placeholder="ai.promptPlaceholder" placeholder="Example: Add a red 'End' node at the end, or generate a login flowchart..." class="w-full p-2 border border-indigo-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none bg-white"></textarea>
                    <button id="askAiBtn" class="mt-2 w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-md text-sm font-medium transition-colors flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.64 3.68-1.25-1.25a.96.96 0 0 0-1.36 0l-3.23 3.23 1.25 1.25a.96.96 0 0 0 1.36 0l3.23-3.23a.96.96 0 0 0 0-1.36Z"></path><path d="m14.65 6.78 3.54 3.54"></path><path d="m3.38 18.2 2.37-2.37"></path><path d="m5.5 19.33-1.63 1.63a1 1 0 0 1-1.42 0l-1-1a1 1 0 0 1 0-1.42l1.63-1.63"></path><path d="M12.98 9.58 4.25 18.3l-1.04-1.04A3 3 0 0 1 2.3 15.1l7.85-8.73"></path><path d="M10.15 7.42 16.3 1.27a2.5 2.5 0 0 1 3.53 0l2.9 2.9a2.5 2.5 0 0 1 0 3.54L16.58 13.85"></path></svg>
                        <span id="askAiBtnText" data-i18n="ai.askBtnIdle">Ask AI to Generate/Modify</span>
                        <div id="aiSpinner" class="spinner hidden"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 右側面板：圖表預覽 -->
    <div class="flex-1 h-1/2 md:h-full relative flex flex-col bg-white">
        <!-- 狀態提示元件 -->
        <div id="toast" class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded shadow-lg text-sm transition-opacity duration-300 opacity-0 pointer-events-none z-50">
            Message
        </div>

        <div class="absolute top-4 right-4 z-20 bg-white/80 backdrop-blur px-3 py-1.5 rounded-full shadow-sm border border-slate-200 text-xs font-medium text-slate-500 flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            <span data-i18n="viewer.panZoomHint">Pan and zoom supported</span>
        </div>
        
        <!-- Draw.io 渲染容器 -->
        <div id="viewerContainer" class="flex-1 w-full h-full relative overflow-hidden bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9IiNlNWEzYWIiLz48L3N2Zz4=')]">
            <div id="loadingState" class="absolute inset-0 flex items-center justify-center text-slate-400 font-medium">
                <span data-i18n="viewer.loading">Loading diagram...</span>
            </div>
        </div>
    </div>

    <!-- Gemini 設定 Modal -->
    <div id="geminiSettingsModal" class="fixed inset-0 z-40 hidden items-center justify-center p-4">
        <div id="geminiSettingsBackdrop" class="absolute inset-0 bg-slate-900/60"></div>
        <div class="relative z-10 w-full max-w-md bg-white rounded-xl shadow-2xl border border-slate-200 p-5">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-slate-800" data-i18n="settings.title">Gemini Settings</h3>
                <button id="closeGeminiSettingsBtn" class="text-slate-400 hover:text-slate-600 text-xl leading-none" data-i18n-title="settings.closeAriaLabel" aria-label="Close settings">×</button>
            </div>
            <div class="grid gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1" data-i18n="settings.apiKeyLabel">API Key</label>
                    <input type="password" id="apiKeyInput" data-i18n-placeholder="settings.apiKeyPlaceholder" placeholder="Enter your Gemini API Key" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1" data-i18n="settings.modelLabel">Model Name</label>
                    <input type="text" id="modelInput" placeholder="gemini-flash-latest" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
                </div>
            </div>
            <div class="mt-4 flex justify-end gap-2">
                <button id="cancelGeminiSettingsBtn" class="px-4 py-2 text-sm border border-slate-300 rounded-md hover:bg-slate-100 transition-colors" data-i18n="settings.cancelBtn">Cancel</button>
                <button id="saveGeminiSettingsBtn" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-md transition-colors" data-i18n="settings.saveBtn">Save Settings</button>
            </div>
        </div>
    </div>

    <script src="./scripts/modules/i18n/en.js"></script>
    <script src="./scripts/modules/i18n/zh-TW.js"></script>
    <script type="module" src="./scripts/app.js"></script>
</body>
</html>
